<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Cat Paw Clicker 🐾</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { font-family: 'Inter', sans-serif; margin: 0; padding: 0; box-sizing: border-box; }
  .font-fun { font-family: 'Comfortaa', cursive; }
  html, body { height: 100%; overflow: hidden; touch-action: none; background: #1e1f22; } /* Discord Dark BG */
  
  /* Discord Color Vars */
  :root {
    --bg-primary: #1e1f22;
    --bg-secondary: #202225;
    --bg-tertiary: #2f3136;
    --bg-accent: #36393f;
    --text-primary: #ffffff;
    --text-secondary: #b9bbbe;
    --text-muted: #72767d;
    --interactive-normal: #b9bbbe;
    --interactive-hover: #dcddde;
    --interactive-active: #ffffff;
    --blurple: #5865f2;
    --blurple-hover: #4752c4;
    --green: #57f287;
    --red: #ed4245;
    --yellow: #fee75c;
    --border: #292b2f;
  }

  .paw { 
    cursor: pointer; 
    user-select: none; 
    pointer-events: auto;
    transition: transform 0.05s ease;
    filter: drop-shadow(0 6px 12px rgba(0,0,0,0.5));
    z-index: 10;
  }
  .paw:active { transform: scale(0.85) rotate(-8deg); }
  .paw.clicked { 
    animation: pawPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; 
    pointer-events: none; 
  }
  @keyframes pawPop {
    0% { transform: scale(1) rotate(var(--rot, 0deg)); opacity: 1; }
    30% { transform: scale(1.4) rotate(calc(var(--rot, 0deg) + 20deg)); opacity: 1; }
    100% { transform: scale(0) rotate(calc(var(--rot, 0deg) + 40deg)); opacity: 0; }
  }
  
  .paw-spawn { animation: spawnIn 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); }
  @keyframes spawnIn {
    from { transform: scale(0.3) rotate(var(--rot, 0deg)); opacity: 0; }
    to { transform: scale(1) rotate(var(--rot, 0deg)); opacity: 1; }
  }
  
  .stat-card { 
    background: var(--bg-tertiary); 
    border: 1px solid var(--border);
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    transition: all 0.2s ease;
  }
  .stat-card.glow { 
    box-shadow: 0 4px 16px rgba(0,0,0,0.3), 0 0 20px rgba(88, 101, 242, 0.4);
    animation: glowPulse 1.5s ease-in-out infinite;
  }
  @keyframes glowPulse { 0%, 100% { box-shadow: 0 4px 16px rgba(0,0,0,0.3), 0 0 20px rgba(88, 101, 242, 0.4); } 50% { box-shadow: 0 4px 16px rgba(0,0,0,0.3), 0 0 40px rgba(88, 101, 242, 0.7); } }
  
  .particle { 
    position: fixed; 
    pointer-events: none; 
    z-index: 1000; 
    animation: particleFly 0.7s ease-out forwards; 
    border-radius: 50%;
  }
  @keyframes particleFly {
    0% { transform: translate(0, 0) scale(1); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
  }
  
  .btn-primary {
    background: var(--blurple);
    color: white;
    font-weight: 600;
    transition: background 0.15s ease, transform 0.1s ease;
    border: none;
  }
  .btn-primary:hover:not(:disabled) { background: var(--blurple-hover); }
  .btn-primary:active:not(:disabled) { transform: scale(0.97); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; background: var(--bg-accent); color: var(--text-muted); }
  
  .btn-secondary {
    background: var(--bg-accent);
    color: var(--text-primary);
    border: 1px solid var(--border);
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .btn-secondary:hover { background: var(--bg-tertiary); border-color: var(--interactive-muted); }
  
  .diff-btn {
    background: var(--bg-accent);
    color: var(--text-secondary);
    border: 1px solid var(--border);
    transition: all 0.15s ease;
  }
  .diff-btn:hover { background: var(--bg-tertiary); color: var(--text-primary); border-color: var(--blurple); }
  .diff-btn.active {
    background: var(--blurple);
    color: white;
    border-color: var(--blurple);
    box-shadow: 0 0 0 1px var(--blurple), 0 4px 12px rgba(88, 101, 242, 0.3);
  }
  
  /* Centered Game Window - Discord Modal Style */
  #game-window {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 92vw; max-width: 1000px;
    height: 85vh; max-height: 800px; min-height: 450px;
    background: var(--bg-primary);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 16px 64px rgba(0,0,0,0.8), 0 0 0 1px rgba(88,101,242,0.1);
    overflow: hidden;
    z-index: 10;
    display: flex;
    flex-direction: column;
    font-family: 'Inter', sans-serif;
  }
  
  #game-area {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: var(--bg-secondary);
  }
  
  .window-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-secondary);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    min-height: 48px;
  }
  .window-title { font-weight: 700; color: var(--text-primary); font-size: 1rem; display: flex; align-items: center; gap: 8px; }
  .window-title .icon { color: var(--blurple); font-size: 1.2rem; }
  .window-controls { display: flex; gap: 6px; }
  .win-btn { width: 12px; height: 12px; border-radius: 50%; border: none; cursor: default; opacity: 0.7; }
  .win-btn.close { background: #f04747; }
  .win-btn.min { background: #f0b232; }
  .win-btn.max { background: #35b450; }
  
  .scrollbar-thin::-webkit-scrollbar { width: 8px; height: 8px; }
  .scrollbar-thin::-webkit-scrollbar-track { background: transparent; }
  .scrollbar-thin::-webkit-scrollbar-thumb { background: var(--bg-accent); border-radius: 4px; border: 2px solid transparent; background-clip: content-box; }
  .scrollbar-thin::-webkit-scrollbar-thumb:hover { background: var(--interactive-muted); }
  
  @media (max-width: 640px) {
    #game-window { width: 100vw; height: 100vh; max-width: none; max-height: none; border-radius: 0; border: none; top: 0; left: 0; transform: none; }
    .stat-card { padding: 0.6rem 0.5rem; }
    .stat-value { font-size: 1.5rem !important; }
    .stat-label { font-size: 0.6rem !important; }
    .window-header { border-radius: 0; }
    .window-controls { display: none; }
  }
  
  @media (prefers-reduced-motion: reduce) {
    .paw, .paw-spawn, .particle, .stat-card.glow { animation: none !important; transition: none !important; }
  }
  
  /* Focus visible for accessibility */
  button:focus-visible { outline: 2px solid var(--blurple); outline-offset: 2px; }
</style>
</head>
<body>

<!-- Centered Game Window -->
<div id="game-window" role="dialog" aria-label="Cat Paw Clicker Game">
  <!-- Window Header -->
  <div class="window-header">
    <div class="window-title"><span class="icon">🐾</span>Cat Paw Clicker</div>
    <div class="window-controls" aria-hidden="true">
      <button class="win-btn close" title="Закрыть"></button>
      <button class="win-btn max" title="Развернуть"></button>
      <button class="win-btn min" title="Свернуть"></button>
    </div>
  </div>

  <!-- Game Area -->
  <div id="game-area" tabindex="0" aria-label="Игровая зона, лапки появляются здесь"></div>

  <!-- Bottom Bar (Discord Style) -->
  <div class="border-t border-[var(--border)] bg-[var(--bg-secondary)] p-3 md:p-4 flex flex-col md:flex-row items-center justify-between gap-3 min-h-[80px]">
    
    <!-- Stats Left -->
    <div class="flex flex-wrap items-center justify-center md:justify-start gap-2 w-full md:w-auto shrink-0" id="stats-container">
      <div class="stat-card rounded-lg px-3 md:px-4 py-2 md:py-3 text-center min-w-[70px] flex-1 md:flex-none" id="clicks-card">
        <div class="stat-label text-[var(--text-muted)] text-[10px] md:text-xs font-semibold uppercase tracking-wider">Клики</div>
        <div id="click-count" class="stat-value font-fun text-xl md:text-2xl font-bold text-[var(--yellow)] drop-shadow-[0_0_8px_rgba(254,231,92,0.5)]">0</div>
      </div>
      <div class="stat-card rounded-lg px-3 md:px-4 py-2 md:py-3 text-center min-w-[70px] flex-1 md:flex-none">
        <div class="stat-label text-[var(--text-muted)] text-[10px] md:text-xs font-semibold uppercase tracking-wider">Пропуск</div>
        <div id="miss-count" class="stat-value font-fun text-xl md:text-2xl font-bold text-[var(--red)]">0</div>
      </div>
      <div class="stat-card rounded-lg px-3 md:px-4 py-2 md:py-3 text-center min-w-[70px] flex-1 md:flex-none">
        <div class="stat-label text-[var(--text-muted)] text-[10px] md:text-xs font-semibold uppercase tracking-wider">Точность</div>
        <div id="accuracy" class="stat-value font-fun text-xl md:text-2xl font-bold text-[var(--green)]">100%</div>
      </div>
      <div class="stat-card rounded-lg px-3 md:px-4 py-2 md:py-3 text-center min-w-[70px] flex-1 md:flex-none glow">
        <div class="stat-label text-[var(--text-muted)] text-[10px] md:text-xs font-semibold uppercase tracking-wider">Время</div>
        <div id="timer" class="stat-value font-fun text-xl md:text-2xl font-bold text-[var(--blurple)]">30</div>
      </div>
    </div>

    <!-- Controls Center -->
    <div class="flex flex-col sm:flex-row items-center justify-center gap-2 w-full md:w-auto shrink-0">
      <button id="start-btn" class="btn-primary w-full sm:w-auto px-6 py-2.5 rounded-lg text-sm md:text-base font-semibold flex items-center justify-center gap-2" aria-label="Начать игру">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <span id="btn-text">СТАРТ</span>
      </button>
      <button id="reset-btn" class="btn-secondary w-full sm:w-auto px-4 py-2.5 rounded-lg text-sm font-medium flex items-center justify-center gap-2" aria-label="Сбросить счёт">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        <span class="hidden sm:inline">СБРОС</span>
      </button>
    </div>

    <!-- Difficulty Right -->
    <div class="flex flex-wrap items-center justify-center md:justify-end gap-2 w-full md:w-auto shrink-0">
      <span class="text-[var(--text-muted)] text-xs hidden md:inline">Сложность:</span>
      <div class="flex flex-wrap gap-1.5 justify-center md:justify-end" id="difficulty-btns" role="group" aria-label="Выбор сложности">
        <button data-speed="600" data-life="2500" data-max="6" class="diff-btn px-3 py-1.5 rounded-md text-xs font-medium" aria-pressed="false">Лёгкий</button>
        <button data-speed="350" data-life="1600" data-max="9" class="diff-btn px-3 py-1.5 rounded-md text-xs font-medium active" aria-pressed="true">Нормальный</button>
        <button data-speed="200" data-life="1000" data-max="12" class="diff-btn px-3 py-1.5 rounded-md text-xs font-medium" aria-pressed="false">Сложный</button>
        <button data-speed="120" data-life="700" data-max="16" class="diff-btn px-3 py-1.5 rounded-md text-xs font-medium" aria-pressed="false">Безумный</button>
      </div>
    </div>

  </div>
</div>

<!-- Sound & Game Logic -->
<script>
// ============ GAME STATE ============
let clicks = 0, misses = 0, gameRunning = false, spawnInterval = null, timerInterval = null;
let timeLeft = 30;
let spawnSpeed = 350, pawLife = 1600, maxPaws = 9;
const gameArea = document.getElementById('game-area');
const clickCountEl = document.getElementById('click-count');
const missCountEl = document.getElementById('miss-count');
const accuracyEl = document.getElementById('accuracy');
const timerEl = document.getElementById('timer');
const startBtn = document.getElementById('start-btn');
const btnText = document.getElementById('btn-text');
const resetBtn = document.getElementById('reset-btn');
const clicksCard = document.getElementById('clicks-card');

// Audio Context
let audioCtx = null;
function getAudioCtx() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); return audioCtx; }
function playTone(freq, dur, type='sine', vol=0.06) {
  try {
    const ctx = getAudioCtx(); if(ctx.state === 'suspended') ctx.resume();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.type = type; o.frequency.value = freq; g.gain.value = vol;
    o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + dur);
  } catch(e) {}
}
function playClick() { playTone(880, 0.05, 'square', 0.05); playTone(1320, 0.07, 'sine', 0.03); }
function playMiss() { playTone(150, 0.12, 'sawtooth', 0.05); }
function playStart() { [523, 659, 784, 1047].forEach((f,i)=>setTimeout(()=>playTone(f,0.07,'triangle',0.04),i*35)); }
function playGameOver() { [784, 659, 523, 392].forEach((f,i)=>setTimeout(()=>playTone(f,0.1,'sine',0.05),i*70)); }

// ============ REALISTIC CAT PAW SVG GENERATOR ============
function createPawSVG(size, rotation) {
  const colors = [
    { pad: '#ff9eb5', fur: '#fff0f0', claw: '#ffe0e8' }, // Pink
    { pad: '#ffb3a7', fur: '#fff8f0', claw: '#ffe8e0' }, // Peach
    { pad: '#c8a8e8', fur: '#f5f0ff', claw: '#e8e0ff' }, // Lavender
    { pad: '#a8d8e8', fur: '#f0faff', claw: '#e0f8ff' }, // Blue
    { pad: '#b8e8a8', fur: '#f0fff0', claw: '#e8ffe8' }, // Mint
  ];
  const c = colors[Math.floor(Math.random() * colors.length)];
  const s = size / 100;
  
  return `
    <svg width="${size}" height="${size}" viewBox="0 0 100 100" style="transform: rotate(${rotation}deg); filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));">
      <!-- Hind paws -->
      <ellipse cx="28" cy="78" rx="${14*s}" ry="${18*s}" fill="${c.pad}" opacity="0.7"/>
      <ellipse cx="72" cy="78" rx="${14*s}" ry="${18*s}" fill="${c.pad}" opacity="0.7"/>
      <ellipse cx="28" cy="76" rx="${8*s}" ry="${10*s}" fill="${c.claw}"/>
      <ellipse cx="72" cy="76" rx="${8*s}" ry="${10*s}" fill="${c.claw}"/>
      
      <!-- Main pad (metacarpal) -->
      <ellipse cx="50" cy="62" rx="${28*s}" ry="${22*s}" fill="${c.pad}"/>
      <ellipse cx="50" cy="58" rx="${22*s}" ry="${16*s}" fill="${c.claw}"/>
      
      <!-- Toe beans (digital pads) -->
      <ellipse cx="30" cy="42" rx="${13*s}" ry="${15*s}" fill="${c.pad}"/>
      <ellipse cx="44" cy="36" rx="${14*s}" ry="${16*s}" fill="${c.pad}"/>
      <ellipse cx="56" cy="36" rx="${14*s}" ry="${16*s}" fill="${c.pad}"/>
      <ellipse cx="70" cy="42" rx="${13*s}" ry="${15*s}" fill="${c.pad}"/>
      
      <!-- Toe highlights -->
      <ellipse cx="28" cy="38" rx="${7*s}" ry="${8*s}" fill="${c.claw}" opacity="0.9"/>
      <ellipse cx="42" cy="32" rx="${8*s}" ry="${9*s}" fill="${c.claw}" opacity="0.9"/>
      <ellipse cx="58" cy="32" rx="${8*s}" ry="${9*s}" fill="${c.claw}" opacity="0.9"/>
      <ellipse cx="72" cy="38" rx="${7*s}" ry="${8*s}" fill="${c.claw}" opacity="0.9"/>
      
      <!-- Dew claws -->
      <ellipse cx="18" cy="55" rx="${7*s}" ry="${10*s}" fill="${c.pad}" transform="rotate(-20 18 55)"/>
      <ellipse cx="82" cy="55" rx="${7*s}" ry="${10*s}" fill="${c.pad}" transform="rotate(20 82 55)"/>
      <ellipse cx="16" cy="52" rx="${4*s}" ry="${6*s}" fill="${c.claw}" transform="rotate(-20 16 52)"/>
      <ellipse cx="84" cy="52" rx="${4*s}" ry="${6*s}" fill="${c.claw}" transform="rotate(20 84 52)"/>
      
      <!-- Fur texture -->
      <g stroke="${c.fur}" stroke-width="${1.5*s}" fill="none" opacity="0.4">
        <path d="M25 85 Q30 75 35 85"/>
        <path d="M40 85 Q45 75 50 85"/>
        <path d="M50 85 Q55 75 60 85"/>
        <path d="M65 85 Q70 75 75 85"/>
        <path d="M20 60 Q25 55 30 60"/>
        <path d="M70 60 Q75 55 80 60"/>
      </g>
    </svg>
  `;
}

// ============ PAW SPAWNING (Constrained to Game Area) ============
function spawnPaw() {
  if (!gameRunning) return;
  
  const currentPaws = gameArea.querySelectorAll('.paw:not(.clicked)').length;
  if (currentPaws >= maxPaws) return;
  
  const paw = document.createElement('div');
  paw.className = 'paw paw-spawn';
  paw.setAttribute('role', 'button');
  paw.setAttribute('aria-label', 'Лапка котика, кликни меня');
  paw.tabIndex = 0;
  
  const size = 70 + Math.random() * 70; // 70-140px
  const rotation = Math.random() * 60 - 30;
  
  paw.innerHTML = createPawSVG(size, rotation);
  paw.style.width = size + 'px';
  paw.style.height = size + 'px';
  paw.style.setProperty('--rot', rotation + 'deg');
  
  // Get Game Area bounds
  const rect = gameArea.getBoundingClientRect();
  const padding = 20;
  const maxX = rect.width - size - padding;
  const maxY = rect.height - size - padding;
  
  if (maxX < padding || maxY < padding) return;
  
  const x = padding + Math.random() * maxX;
  const y = padding + Math.random() * maxY;
  
  paw.style.left = x + 'px';
  paw.style.top = y + 'px';
  paw.style.position = 'absolute';
  
  const handleActivate = (e) => {
    if (e.type === 'keydown' && e.key !== 'Enter' && e.key !== ' ') return;
    e.stopPropagation(); e.preventDefault();
    if (!gameRunning || paw.classList.contains('clicked')) return;
    const pawRect = paw.getBoundingClientRect();
    handlePawClick(paw, pawRect.left + pawRect.width/2, pawRect.top + pawRect.height/2);
  };
  
  paw.addEventListener('pointerdown', handleActivate, { passive: false });
  paw.addEventListener('keydown', handleActivate);
  
  gameArea.appendChild(paw);
  
  const lifeTime = pawLife * (0.8 + Math.random() * 0.4);
  setTimeout(() => {
    if (paw.parentElement && !paw.classList.contains('clicked')) {
      handlePawMiss(paw);
    }
  }, lifeTime);
}

function handlePawClick(paw, clientX, clientY) {
  paw.classList.add('clicked');
  clicks++;
  updateStats();
  playClick();
  createParticles(clientX, clientY, 'click');
  createPawPrint(clientX, clientY);
  setTimeout(() => paw.remove(), 350);
}

function handlePawMiss(paw) {
  if (!gameRunning) return;
  misses++;
  updateStats();
  playMiss();
  paw.style.animation = 'missShake 0.25s ease-out';
  paw.style.opacity = '0.5';
  setTimeout(() => { if (paw.parentElement) paw.remove(); }, 250);
}

function createPawPrint(x, y) {
  const print = document.createElement('div');
  print.style.cssText = `
    position: fixed; left: ${x}px; top: ${y}px; transform: translate(-50%, -50%);
    width: 40px; height: 40px; pointer-events: none; z-index: 5;
    background: radial-gradient(circle at 50% 60%, #ff9eb5 0%, #ff6b8a 70%, transparent 100%);
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    opacity: 0.4; animation: printFade 1s ease-out forwards;
  `;
  document.body.appendChild(print);
  setTimeout(() => print.remove(), 1000);
}

function createParticles(x, y, type) {
  const colors = type === 'click' 
    ? ['#fee75c', '#ffffff', '#ffeb3b', '#ff9eb5', '#ffb3a7'] 
    : ['#ed4245', '#f04747', '#ffffff', '#ffaaaa'];
  const count = type === 'click' ? 10 : 6;
  
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const sz = 4 + Math.random() * 7;
    p.style.cssText = `
      left: ${x}px; top: ${y}px; width: ${sz}px; height: ${sz}px;
      background: ${colors[Math.floor(Math.random() * colors.length)]};
      border-radius: ${Math.random() > 0.5 ? '50%' : '30% 70% 70% 30% / 30% 30% 70% 70%'};
    `;
    const angle = Math.random() * Math.PI * 2;
    const dist = 50 + Math.random() * 70;
    p.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
    p.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 700);
  }
}

function updateStats() {
  clickCountEl.textContent = clicks;
  missCountEl.textContent = misses;
  const total = clicks + misses;
  const acc = total > 0 ? Math.round((clicks / total) * 100) : 100;
  accuracyEl.textContent = acc + '%';
  
  if (acc < 40) accuracyEl.style.color = 'var(--red)';
  else if (acc < 70) accuracyEl.style.color = 'var(--yellow)';
  else accuracyEl.style.color = 'var(--green)';
  
  clicksCard.classList.add('glow');
  setTimeout(() => clicksCard.classList.remove('glow'), 200);
}

// ============ GAME CONTROL ============
function startGame() {
  if (gameRunning) return;
  getAudioCtx().resume();
  
  gameRunning = true;
  clicks = 0; misses = 0; timeLeft = 30;
  updateStats();
  timerEl.textContent = timeLeft;
  timerEl.style.color = 'var(--blurple)';
  
  btnText.textContent = 'ИГРА...';
  startBtn.disabled = true;
  startBtn.setAttribute('aria-disabled', 'true');
  playStart();
  
  gameArea.innerHTML = '';
  gameArea.focus(); // Focus for keyboard support
  
  for (let i = 0; i < 3; i++) setTimeout(spawnPaw, i * 80);
  
  spawnInterval = setInterval(spawnPaw, spawnSpeed);
  
  timerInterval = setInterval(() => {
    timeLeft--;
    timerEl.textContent = timeLeft;
    if (timeLeft <= 5) timerEl.style.color = 'var(--red)';
    if (timeLeft <= 0) stopGame();
  }, 1000);
  
  setTimeout(stopGame, 30000);
}

function stopGame() {
  if (!gameRunning) return;
  gameRunning = false;
  clearInterval(spawnInterval);
  clearInterval(timerInterval);
  playGameOver();
  
  const best = parseInt(localStorage.getItem('catPawBest') || '0');
  if (clicks > best) {
    localStorage.setItem('catPawBest', clicks.toString());
    showBestToast(clicks);
  }
  
  btnText.textContent = 'СНОВА';
  startBtn.disabled = false;
  startBtn.setAttribute('aria-disabled', 'false');
}

function resetGame() {
  stopGame();
  clicks = 0; misses = 0; timeLeft = 30;
  updateStats();
  timerEl.textContent = timeLeft;
  timerEl.style.color = 'var(--blurple)';
  gameArea.innerHTML = '';
  btnText.textContent = 'СТАРТ';
}

function showBestToast(score) {
  const toast = document.createElement('div');
  toast.style.cssText = `
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: var(--bg-tertiary); border: 1px solid var(--blurple);
    color: var(--yellow); padding: 12px 24px; border-radius: 8px;
    font-weight: 600; z-index: 100; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    animation: toastIn 0.3s ease-out;
  `;
  toast.textContent = `🏆 Новый рекорд: ${score} кликов!`;
  document.body.appendChild(toast);
  setTimeout(() => { toast.style.animation = 'toastOut 0.3s ease-in forwards'; setTimeout(() => toast.remove(), 300); }, 3000);
}

// ============ EVENT LISTENERS ============
startBtn.addEventListener('click', () => { if (!gameRunning) startGame(); });
resetBtn.addEventListener('click', resetGame);

document.querySelectorAll('.diff-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    if (gameRunning) return;
    document.querySelectorAll('.diff-btn').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-pressed', 'false'); });
    btn.classList.add('active');
    btn.setAttribute('aria-pressed', 'true');
    spawnSpeed = parseInt(btn.dataset.speed);
    pawLife = parseInt(btn.dataset.life);
    maxPaws = parseInt(btn.dataset.max);
  });
});

// Load best score on init
const savedBest = parseInt(localStorage.getItem('catPawBest') || '0');
// Optional: Show best somewhere if needed, but user asked for clean UI.

document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

// Dynamic styles for animations
const style = document.createElement('style');
style.textContent = `
  @keyframes missShake {
    0%, 100% { transform: translate(-50%, -50%) rotate(var(--rot, 0deg)) translateX(0); }
    25% { transform: translate(-50%, -50%) rotate(calc(var(--rot, 0deg) - 15deg)) translateX(-10px); }
    75% { transform: translate(-50%, -50%) rotate(calc(var(--rot, 0deg) + 15deg)) translateX(10px); }
  }
  @keyframes printFade {
    0% { opacity: 0.4; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(2); }
  }
  @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
  @keyframes toastOut { to { opacity: 0; transform: translateX(-50%) translateY(-20px); } }
  .paw { will-change: transform, opacity; }
  .paw:focus-visible { outline: 2px solid var(--blurple); outline-offset: 3px; border-radius: 8px; }
`;
document.head.appendChild(style);

document.addEventListener('visibilitychange', () => { if (document.hidden && gameRunning) stopGame(); });

// Keyboard shortcut: Space/Enter on Start button when focused
startBtn.addEventListener('keydown', (e) => { if((e.key === ' ' || e.key === 'Enter') && !gameRunning) startGame(); });
</script>
</body>
